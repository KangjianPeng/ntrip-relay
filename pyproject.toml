[project]
name = "ntrip-um960-relay"
version = "0.1.0"
description = "Forward NTRIP RTCM corrections to a UM960 receiver over USB serial"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pynmea2>=1.19.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035", "UP045"]
