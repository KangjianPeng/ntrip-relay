[project]
name = "ntrip-gnss-relay"
version = "0.1.0"
description = "Forward NTRIP RTCM corrections and publish GNSS PVT solutions to ROS 1"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "pynmea2>=1.19.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035", "UP045"]
